<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViFrost – Match History</title>
    <!-- Reuse the same stylesheet and color theme as the profile page -->
    <link rel="stylesheet" href="csc473hw2.css" />
  </head>
  <body>
    <!-- navigation bar -->
    <header class="navbar">
      <div class="nav-left">
        <div class="nav-home">h</div>
        <div class="nav-title">ViFrost</div>
      </div>
      <div class="nav-right">
        <div class="nav-pill"></div>
        <div class="nav-icon">i</div>
        <div class="nav-icon">👤</div>
      </div>
    </header>

    <main class="page">
      <div class="content">
        <section class="card">
          <div class="leaderboard-header">
            <h2>Match History</h2>
            <span>Latest games for ArifMan</span>
          </div>

          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Opponent</th>
                <th>Match Length</th>
                <th>Accuracy</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              <!-- Newest match at the top -->
              <tr>
                <td>1</td>
                <td class="leaderboard-name">SnowCrash</td>
                <td>18:23</td>
                <td>92%</td>
                <td class="leaderboard-change">W</td>
              </tr>
              <tr>
                <td>2</td>
                <td class="leaderboard-name">ZeroKelvin</td>
                <td>22:47</td>
                <td>88%</td>
                <td class="leaderboard-change">W</td>
              </tr>
              <tr>
                <td>3</td>
                <td class="leaderboard-name">Glacier</td>
                <td>15:05</td>
                <td>79%</td>
                <td class="leaderboard-change down">L</td>
              </tr>
              <tr>
                <td>4</td>
                <td class="leaderboard-name">FrostByte</td>
                <td>27:11</td>
                <td>84%</td>
                <td class="leaderboard-change down">L</td>
              </tr>
              <tr>
                <td>5</td>
                <td class="leaderboard-name">ArcticFox</td>
                <td>13:56</td>
                <td>90%</td>
                <td class="leaderboard-change">W</td>
              </tr>
              <tr>
                <td>6</td>
                <td class="leaderboard-name">BlizzardKing</td>
                <td>19:34</td>
                <td>76%</td>
                <td class="leaderboard-change down">L</td>
              </tr>
              <tr>
                <td>7</td>
                <td class="leaderboard-name">IceShard</td>
                <td>11:42</td>
                <td>94%</td>
                <td class="leaderboard-change">W</td>
              </tr>
              <tr>
                <td>8</td>
                <td class="leaderboard-name">ChillWind</td>
                <td>16:29</td>
                <td>81%</td>
                <td class="leaderboard-change down">L</td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
  </body>
</html>
