<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViFrost - Lobby</title>

    <!-- jetbrains mono font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css" />

    <!-- load ascii frames before the page renders -->
    <script src="data/animation.js"></script>
    <script src="scripts/hints.js"></script>
</head>

<body>

    <nav class="navbar">

        <div class="navbar__logo">
            <div class="navbar__logo-icon">
                <img src="assets/Icon.svg" alt="ViFrost" />
            </div>
            <span class="navbar__title">ViFrost</span>
        </div>

        <div class="navbar__right">
            <button class="navbar__stats-btn" title="Leaderboard">
                <img src="assets/LeaderboardIcon.svg" alt="Leaderboard" />
            </button>
            <button type="button" class="navbar__log-in-btn">
                <img src="assets/AvatarIcon.svg" alt="Avatar" />
            </button>
        </div>

    </nav>

    <main class="lobby">

        <div class="lobby_card">

            <!-- ascii animation cycles through pre-generated frames -->
            <pre id="ascii-stage" class="ascii-output"></pre>

            <button type="button" class="lobby_join_btn" onclick="location.href='queue.html'">
                Join Queue
            </button>

        </div>

        <!-- random vim hint fades in and out at the bottom of the page -->
        <div class="hint">
            <h1 class="hint_text"></h1>
        </div>

    </main>

    <script src="scripts/lobby.js"></script>

</body>

</html>
